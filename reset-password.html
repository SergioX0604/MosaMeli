<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - MosaMeli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #FFD1DC 0%, #D1C4E9 50%, #FFF8E1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-container {
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(155, 127, 212, 0.3);
            text-align: center;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reset-logo { margin-bottom: 20px; }
        .reset-logo img { max-width: 160px; height: auto; }

        .reset-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4A3A5C;
            margin-bottom: 25px;
        }

        .reset-container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #EDE4F5;
            border-radius: 12px;
            padding: 0 12px;
            background: #FFF8E1;
            transition: all 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #9B7FD4;
            background: white;
            box-shadow: 0 0 0 4px rgba(155, 127, 212, 0.15);
        }

        .input-wrapper i.fa-lock {
            color: #9B7FD4;
            font-size: 0.95rem;
            margin-right: 10px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            outline: none;
            padding: 14px 0;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            color: #4A3A5C;
            background: transparent;
            min-width: 0;
        }

        .input-wrapper input::placeholder { color: #B0A5BD; }

        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            color: #7A6A8C;
            padding: 0 5px;
            font-size: 0.95rem;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .toggle-password:hover { color: #9B7FD4; }

        .reset-container button[type="submit"] {
            background: linear-gradient(135deg, #9B7FD4 0%, #F5A6B8 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(155, 127, 212, 0.3);
        }

        .reset-container button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(155, 127, 212, 0.5);
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
        }

        #success-msg { color: #4CAF50; }
        #error-msg { color: #E57373; }

        .back-link {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #7A6A8C;
        }

        .back-link a {
            color: #9B7FD4;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-logo">
            <img src="img/logo-mosameli.png" alt="MosaMeli">
        </div>

        <h2>Nueva Contraseña</h2>

        <form id="reset-password-form">
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="new-password" placeholder="Escribe tu nueva contraseña" required minlength="6">
                <button type="button" class="toggle-password" onclick="togglePassword('new-password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirm-password" placeholder="Confirma tu nueva contraseña" required minlength="6">
                <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button type="submit">Cambiar Contraseña</button>
        </form>

        <p id="success-msg" class="message">¡Contraseña cambiada con éxito! Redirigiendo...</p>
        <p id="error-msg" class="message"></p>

        <p class="back-link">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Volver a iniciar sesión</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Usar la instancia global para evitar conflictos
            const sc = window.supabaseClient;

            const { data: { session }, error } = await sc.auth.getSession();

            if (error || !session) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.textContent = 'Enlace inválido o expirado. Solicita uno nuevo.';
                errorMsg.style.display = 'block';
            }

            document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const successMsg = document.getElementById('success-msg');
                const errorMsg = document.getElementById('error-msg');

                successMsg.style.display = 'none';
                errorMsg.style.display = 'none';

                if (newPassword !== confirmPassword) {
                    errorMsg.textContent = 'Las contraseñas no coinciden';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (newPassword.length < 6) {
                    errorMsg.textContent = 'La contraseña debe tener al menos 6 caracteres';
                    errorMsg.style.display = 'block';
                    return;
                }

                const { error } = await sc.auth.updateUser({ password: newPassword });

                if (error) {
                    if (error.message.includes('different from the old')) {
                        errorMsg.textContent = '⚠️ La nueva contraseña debe ser diferente a la anterior';
                    } else if (error.message.includes('should be at least')) {
                        errorMsg.textContent = '⚠️ La contraseña es muy corta (mínimo 6 caracteres)';
                    } else {
                        errorMsg.textContent = 'Error: ' + error.message;
                    }
                    errorMsg.style.display = 'block';
                } else {
                    successMsg.style.display = 'block';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                }
            });
        });
    </script>
</body>
</html>
