<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - MosaMeli</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--crema-pastel); }
        .auth-container { background: white; padding: 40px; border-radius: 20px; width: 90%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .auth-container h2 { color: var(--violeta-intenso); margin-bottom: 20px; }
        .auth-container form { display: flex; flex-direction: column; gap: 15px; }
        .auth-container button[type="submit"] { background: var(--violeta-intenso); color: white; border: none; padding: 15px; border-radius: 50px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; transition: background 0.3s; }
        .auth-container button[type="submit"]:hover { background: var(--violeta-hover); }
        .message { margin-top: 15px; font-size: 0.95rem; }
        #success-msg { color: #4CAF50; display: none; }
        #error-msg { color: #D32F2F; display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Nueva Contraseña</h2>
        <form id="reset-password-form">
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="new-password" placeholder="Escribe tu nueva contraseña" required minlength="6">
                <button type="button" class="toggle-password" onclick="togglePassword('new-password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirm-password" placeholder="Confirma tu nueva contraseña" required minlength="6">
                <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button type="submit">Cambiar Contraseña</button>
        </form>
        <p id="success-msg" class="message">¡Contraseña cambiada con éxito! Redirigiendo...</p>
        <p id="error-msg" class="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (error || !session) {
                document.getElementById('error-msg').textContent = 'Enlace inválido o expirado. Solicita uno nuevo.';
                document.getElementById('error-msg').style.display = 'block';
            }

            document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const successMsg = document.getElementById('success-msg');
                const errorMsg = document.getElementById('error-msg');

                successMsg.style.display = 'none';
                errorMsg.style.display = 'none';

                if (newPassword !== confirmPassword) {
                    errorMsg.textContent = 'Las contraseñas no coinciden';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (newPassword.length < 6) {
                    errorMsg.textContent = 'La contraseña debe tener al menos 6 caracteres';
                    errorMsg.style.display = 'block';
                    return;
                }

                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

                if (error) {
                    if (error.message.includes('different from the old')) {
                        errorMsg.textContent = '⚠️ La nueva contraseña debe ser diferente a la anterior';
                    } else if (error.message.includes('should be at least')) {
                        errorMsg.textContent = '⚠️ La contraseña es muy corta (mínimo 6 caracteres)';
                    } else {
                        errorMsg.textContent = 'Error: ' + error.message;
                    }
                    errorMsg.style.display = 'block';
                } else {
                    successMsg.style.display = 'block';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                }
            });
        });
    </script>
</body>
</html>
